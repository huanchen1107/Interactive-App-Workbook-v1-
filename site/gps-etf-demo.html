<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPS-ETF · Four-step Workbook Demo</title><style>
:root{color-scheme:light;--ink:#17324d;--muted:#667789;--line:#d8e3ec;--navy:#173b5c;--green:#168467;--green-soft:#e6f4ef;--amber-soft:#fff4dc;--wash:#f3f7fa;--danger:#a43a3a}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}.shell{max-width:1180px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.head a{color:var(--navy)}.safe{color:var(--muted);font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 16px 42px #17324d10}.steps{display:grid;grid-template-columns:repeat(4,1fr)}.step{min-height:64px;padding:12px;text-align:center;background:#eef5f2;border:0;border-right:1px solid #d5e6df;color:#506a62;font-weight:750}.step span{display:block;font-size:12px}.step.active{background:var(--navy);color:#fff}.step.done{background:var(--green-soft);color:#14634f}.gps{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px;padding:24px;border-bottom:1px solid var(--line);background:#fbfdfe}.gps small{display:block;color:var(--muted)}.gps b{display:block;margin-top:5px}.work{display:grid;grid-template-columns:.82fr 1.18fr;gap:22px;padding:24px;min-height:440px}.guide{padding:24px;border-radius:14px;background:#f6f9fb}.guide h1{font-size:27px;line-height:1.2;margin:8px 0 14px}.guide li{margin:9px 0}.kicker{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.1em}.standard{margin-top:20px;padding:14px;border-left:4px solid var(--green);background:#fff}.action h2{margin-top:0}.field{display:block;margin:14px 0;font-weight:700}.field small{display:block;color:var(--muted);font-weight:400}.field input,.field select{display:block;width:100%;min-height:44px;margin-top:6px;padding:10px 12px;border:1px solid #bfcdd8;border-radius:9px;background:#fff;color:var(--ink);font:inherit}.choices{display:grid;gap:10px}.choice{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:11px}.choice:has(input:checked){border-color:var(--green);background:#f1faf6}.feedback{min-height:74px;margin-top:18px;padding:14px;border-radius:10px;background:var(--amber-soft);border-left:4px solid #e3a52f;color:#68470d}.feedback.pass{background:var(--green-soft);border-color:var(--green);color:#125d4a}.feedback.error{background:#fff0f0;border-color:var(--danger);color:#7c2929}.scan{display:grid;gap:12px}.scan-row{display:flex;justify-content:space-between;padding:14px;border:1px solid var(--line);border-radius:10px}.meter{height:9px;overflow:hidden;border-radius:99px;background:#e5edf2}.meter span{display:block;width:0;height:100%;background:var(--green);transition:width .7s ease}.result-card{padding:17px;border:1px solid var(--line);border-radius:12px}.result-card header{display:flex;justify-content:space-between;gap:12px}.badge{padding:3px 8px;border-radius:99px;background:var(--green-soft);color:#14634f;font-size:12px;font-weight:800}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-top:1px solid var(--line)}.footer-actions{display:flex;gap:10px}button{min-height:44px;border:0;border-radius:9px;padding:10px 17px;background:var(--navy);color:#fff;font:inherit;font-weight:750;cursor:pointer}button.secondary{background:#e8f0f5;color:var(--navy)}button:disabled{cursor:not-allowed;opacity:.42}.completion{display:none;padding:38px}.completion.show{display:block}.completion strong{color:var(--green);font-size:25px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.summary div{padding:16px;border:1px solid var(--line);border-radius:11px}.summary b{display:block;font-size:22px}@media(max-width:760px){.gps,.work{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.work{min-height:0}.summary{grid-template-columns:1fr}.head{align-items:flex-start;gap:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="shell"><header class="head"><div><b>GPS-ETF · 四步 Interactive Workbook Demo</b><div class="safe">公開虛構資料 · 不連接券商 · 不會下單</div></div><a href="index.html">返回設計白皮書</a></header><section class="panel" id="workbook"><nav class="steps" aria-label="Workbook 進度" id="steps"></nav><div class="gps"><div><small>目前階段</small><b id="gps-goal"></b></div><div><small>系統正在做</small><b id="gps-system"></b></div><div><small>輪到你做</small><b id="gps-user"></b></div></div><div class="work"><aside class="guide"><div class="kicker" id="kicker"></div><h1 id="guide-title"></h1><p id="guide-copy"></p><ol id="guide-list"></ol><div class="standard"><b>完成標準</b><div id="completion-rule"></div></div></aside><section class="action" id="action" aria-live="polite"></section></div><footer class="footer"><span id="step-count"></span><div class="footer-actions"><button class="secondary" id="prev">上一步</button><button id="next">驗證並繼續</button></div></footer></section><section class="panel completion" id="completion" tabindex="-1"><strong>✓ 本輪四步已完成</strong><p>這不是按完四次按鈕，而是每一步都通過了自己的 Evidence Gate。</p><div class="summary"><div><small>研究紀錄</small><b>1</b>已保存</div><div><small>觀察候選</small><b>1</b>DEMO-01</div><div><small>真實訂單</small><b>0</b>安全邊界</div></div><p>下一輪：擴大候選池並重新掃描，累積至少 3–5 檔後再做風險與配置比較。</p><button id="again">重新體驗四步流程</button></section></main><script>
const state={step:0,scan:false};const steps=[
{name:'Plan',sub:'設定目標',goal:'定義這一輪要找什麼',system:'檢查目標是否足以執行',user:'設定候選數量與風險邊界',title:'先定義成功，不要急著掃描',copy:'沒有完成標準，系統只會產生很多資料，不會產生答案。',list:['設定研究目的','設定希望得到的候選數','確認只做研究、不建立訂單'],rule:'目標、候選數與安全界線都已保存。'},
{name:'Do',sub:'執行掃描',goal:'依設定產生可驗證結果',system:'模擬市場漏斗與條件掃描',user:'啟動掃描並查看每層數量',title:'讓系統做工作，也讓過程看得見',copy:'Do 不是只有 loading。漏斗應顯示輸入、淘汰與剩餘，才能追查零結果。',list:['建立 50 檔虛構候選池','通過資料完整度檢查','套用趨勢與 SMC 條件'],rule:'掃描完成，而且保存了各層漏斗數量。'},
{name:'Analyze',sub:'分析結果',goal:'判斷結果是否足以達成目標',system:'比較目標數與實際候選數',user:'讀懂結果並確認問題',title:'有結果不代表已達成目標',copy:'本輪找到 1 檔，但 Plan 希望至少 3 檔。系統必須說清楚缺口。',list:['確認唯一候選的通過條件','比較目標 3 檔與實際 1 檔','把不足送入 Correct'],rule:'已確認結果不足，且知道不足發生在哪個條件。'},
{name:'Correct',sub:'修正決定',goal:'把不足轉成下一輪可執行工作',system:'保存決定與下一次檢查日',user:'選擇觀察、重掃或排除',title:'候選不足時，不讓流程卡死',copy:'先保存這一檔的研究決定，再逐項放寬條件或擴大候選池。',list:['先加入觀察，不下單','下一輪只修改一個變因','累積 3–5 檔後再比較配置'],rule:'保存明確決定、理由與下一次檢查日期。'}];
const el=id=>document.getElementById(id);function render(){const s=steps[state.step];el('steps').innerHTML=steps.map((x,i)=>`<button class="step ${i===state.step?'active':i<state.step?'done':''}" ${i>state.step?'disabled':''} data-step="${i}">${i<state.step?'✓':i+1}. ${x.name}<span>${x.sub}</span></button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(+b.dataset.step<=state.step){state.step=+b.dataset.step;render()}});el('gps-goal').textContent=s.goal;el('gps-system').textContent=s.system;el('gps-user').textContent=s.user;el('kicker').textContent=`第 ${state.step+1} 題 · ${s.name}`;el('guide-title').textContent=s.title;el('guide-copy').textContent=s.copy;el('guide-list').innerHTML=s.list.map(x=>`<li>${x}</li>`).join('');el('completion-rule').textContent=s.rule;el('step-count').textContent=`第 ${state.step+1}／4 步`;el('prev').disabled=state.step===0;el('next').textContent=state.step===3?'完成本輪':'驗證並繼續';el('action').innerHTML=actionHtml();el('prev').onclick=()=>{state.step--;render()};el('next').onclick=validate;bindActions()}
function actionHtml(){if(state.step===0)return `<h2>回答本輪三個必要問題</h2><label class="field">研究目的<select id="objective"><option value="">請選擇</option><option value="trend">尋找技術趨勢候選</option></select></label><label class="field">最低候選數<input id="target" type="number" min="1" max="10" value="3"><small>候選不足時，流程必須進入 Correct。</small></label><label class="choice"><input id="safe" type="checkbox"> 我了解這是研究 Demo，不會建立訂單</label><div class="feedback" id="feedback">請完成三個答案，再進行驗證。</div>`;if(state.step===1)return `<h2>執行候選漏斗</h2><div class="scan"><div class="scan-row"><span>虛構候選池</span><b>50 檔</b></div><div class="scan-row"><span>資料完整</span><b id="data-count">—</b></div><div class="scan-row"><span>趨勢條件通過</span><b id="trend-count">—</b></div><div class="scan-row"><span>SMC 條件通過</span><b id="smc-count">—</b></div><div class="meter"><span id="meter"></span></div><button id="scan">開始模擬掃描</button></div><div class="feedback ${state.scan?'pass':''}" id="feedback">${state.scan?'已保存漏斗證據：50 → 42 → 8 → 1。':'尚未掃描；Do 還沒有產生證據。'}</div>`;if(state.step===2)return `<h2>比較目標與結果</h2><article class="result-card"><header><b>DEMO-01 · 虛構候選</b><span class="badge">完全符合</span></header><p>通過：S2 高週期結構、MACD 多頭、MA20 高於 MA60。</p></article><div class="feedback">Plan 目標至少 3 檔；本輪只有 1 檔，缺少 2 檔。最嚴格漏斗為 SMC 條件（8 → 1）。</div><label class="choice"><input id="understood" type="checkbox"> 我確認本輪有結果，但不足以直接比較投資組合</label>`;return `<h2>做一個明確決定</h2><div class="choices"><label class="choice"><input type="radio" name="decision" checked> 加入技術觀察名單</label><label class="choice"><input type="radio" name="decision"> 修改一個條件後重掃</label><label class="choice"><input type="radio" name="decision"> 排除並記錄原因</label></div><label class="field">下次檢查日期<input type="date" id="date"></label><label class="field">理由<input id="note" value="先觀察，下一輪擴大候選池"></label><div class="feedback" id="feedback">請保存決定；本頁不會建立真實訂單。</div>`}
function bindActions(){if(state.step===1){el('data-count').textContent=state.scan?'42 檔':'—';el('trend-count').textContent=state.scan?'8 檔':'—';el('smc-count').textContent=state.scan?'1 檔':'—';if(state.scan)el('meter').style.width='100%';el('scan').onclick=()=>{el('scan').disabled=true;el('scan').textContent='掃描中…';setTimeout(()=>{state.scan=true;render()},650)}}if(state.step===3)el('date').value=new Date(Date.now()+7*86400000).toISOString().slice(0,10)}function fail(message){const f=el('feedback');if(f){f.className='feedback error';f.textContent=message;f.tabIndex=-1;f.focus()}}
function validate(){if(state.step===0){if(!el('objective').value)return fail('請先選擇研究目的。');if(+el('target').value<1)return fail('最低候選數必須至少為 1。');if(!el('safe').checked)return fail('請確認安全界線。')}else if(state.step===1){if(!state.scan)return fail('請先執行掃描並取得漏斗證據。')}else if(state.step===2){if(!el('understood').checked)return fail('請先確認結果不足，系統才知道要進入 Correct。')}else{if(!el('date').value)return fail('請設定下一次檢查日期。');if(!el('note').value.trim())return fail('請留下這項決定的理由。');el('workbook').style.display='none';el('completion').classList.add('show');el('completion').focus();return}state.step++;render();document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'})}el('again').onclick=()=>{Object.assign(state,{step:0,scan:false});el('workbook').style.display='block';el('completion').classList.remove('show');render()};render();
</script></body></html>
